# Continuous integration for the whole project.
#
# One matrix job covers both packages (the Express API and the Expo app)
# across two Node LTS lines. Each cell is an independent, from-scratch
# environment: `npm ci` installs exactly what package-lock.json pins, then the
# package's own `npm test` runs its Jest suite. A red X on any cell blocks the
# PR, which is the whole point — nothing merges unless both suites pass
# everywhere.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.app }} (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      # Let the other cells finish even if one fails, so a single flake
      # doesn't hide results from the rest of the matrix.
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        app: [express-app, expo-app]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies (clean, from the lockfile)
        run: npm ci

      - name: Run the test suite
        run: npm test
