# Runs both test suites on every push and pull request.
#
# The repo holds two independent apps, so they are two jobs rather than one.
# That matters for reading failures: if the API breaks, the Expo job stays green
# and the failure points at the right half of the repo instead of at "CI".
# They also run in parallel, so two jobs is faster than one.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  express-app:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: express-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Caches ~/.npm keyed on the lockfile, so unchanged dependencies are
          # not re-downloaded on every run.
          cache: npm
          cache-dependency-path: express-app/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile says and fails if package.json and the lockfile disagree.
      # `install` would quietly resolve newer versions, which means CI could
      # pass against dependencies nobody has actually run locally.
      - run: npm ci

      - run: npm test

  expo-app:
    name: Client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - run: npm ci

      - run: npm test
